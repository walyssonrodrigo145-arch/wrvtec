services:
  wrv-site:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
    container_name: wrv-site
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - wrv-data:/app/.data
    networks:
      - wr-music_default

volumes:
  wrv-data:

networks:
  wr-music_default:
    external: true
    name: wr-music-app_default
